services:
  # ─────────────────────────────
  # Nginx
  # ─────────────────────────────
  nginx:
    image: nginx:latest
    container_name: api-products-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/logs:/var/log/nginx
      - ./:/var/www/html
    networks:
      app-network:
        aliases:
          - projeto.site

  # ─────────────────────────────
  # PHP-FPM + Horizon (Laravel, via supervisor)
  # ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: api-products
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      - postgres
      - redis
      - elasticsearch
    volumes:
      - ./:/var/www/html
    networks:
      - app-network

  # ─────────────────────────────
  # PostgreSQL
  # ─────────────────────────────
  postgres:
    image: postgres:17
    container_name: api-products-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  # ─────────────────────────────
  # Redis
  # ─────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: api-products-redis
    command: [ "redis-server", "--appendonly", "yes" ]
    networks:
      - app-network

  # ─────────────────────────────
  # Elasticsearch
  # ─────────────────────────────
  elasticsearch:
    image: elasticsearch:9.1.2
    container_name: api-products-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - app-network

  # ─────────────────────────────
  # Kibana
  # ─────────────────────────────
  kibana:
    image: kibana:9.1.2
    container_name: api-products-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - app-network

volumes:
  postgres-data:
  elasticsearch-data:

networks:
  app-network:
    driver: bridge
